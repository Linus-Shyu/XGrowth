name: heartbeat

on:
  workflow_dispatch:
    inputs:
      stale_hours:
        description: "Stale threshold in hours (default 30)"
        required: false
        default: "30"
  schedule:
    # Every 6 hours; detects silent death (dead token, drained credits, dead RSS).
    - cron: "20 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: x-bot-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEARTBEAT_STALE_HOURS: ${{ inputs.stale_hours || '30' }}
      HEARTBEAT_ARCHIVE_FILE: archive/tweets.jsonl
      HEARTBEAT_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run heartbeat check
        run: node .github/scripts/heartbeat-check.mjs
